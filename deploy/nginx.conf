map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

server {
    listen 4411 ssl http2;
    server_name xn--e1afhclgq.xn--p1ai www.xn--e1afhclgq.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--e1afhclgq.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--e1afhclgq.xn--p1ai/privkey.pem;

    location = / {
        return 302 /admin;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location = /admin/login {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}

server {
    listen 4402 ssl http2;
    server_name xn--e1afhclgq.xn--p1ai www.xn--e1afhclgq.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--e1afhclgq.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--e1afhclgq.xn--p1ai/privkey.pem;

    client_max_body_size 100m;

    location ^~ /admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 65s;
    }
}
